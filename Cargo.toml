[package]
name = "pump-swap-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK to interact with PumpSwap protocol on Solana"
license = "MIT"

[dependencies]
solana-client = "2.1.5"
solana-sdk = "2.1.5"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = [
    "no-entrypoint",
] }
bytemuck = "1.20.0"
anyhow = "1.0.96"
tokio = { version = "1.43.0", features = ["full", "rt", "rt-multi-thread", "macros", "io-std", "time"] }
rand = "0.9.0"
jito-sdk-rust = "0.1.0"
bincode = "1.3.3"
log = "0.4.26"
serde_json = "1.0.133"
serde = { version = "1.0.219", features = ["derive"] }