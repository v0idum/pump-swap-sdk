[package]
name = "pump-swap-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SDK to interact with the PumpSwap (pump-amm) AMM protocol on Solana"
license = "MIT"
readme = "README.md"
repository = "https://github.com/v0idum/pump-swap-sdk"
keywords = ["solana", "pumpswap", "pump-amm", "defi", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
solana-client = "2.1.5"
solana-sdk = "2.1.5"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
bytemuck = "1.20.0"
anyhow = "1.0.96"
tokio = { version = "1.43.0", features = ["full"] }
rand = "0.9.0"
jito-sdk-rust = "0.3.2"
bincode = "1.3.3"
base64 = "0.21.7"
log = "0.4.26"
serde_json = "1.0.133"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
