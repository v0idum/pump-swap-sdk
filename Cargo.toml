[package]
name = "pump-swap-sdk"
version = "0.6.0"
edition = "2024"
rust-version = "1.97.1"
description = "SDK to interact with the PumpSwap (pump-amm) AMM protocol on Solana"
license = "MIT"
readme = "README.md"
repository = "https://github.com/v0idum/pump-swap-sdk"
keywords = ["solana", "pumpswap", "pump-amm", "defi", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
solana-client = "4.3.0"
solana-sdk = "4.1.0"
solana-compute-budget-interface = "3.1.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
bytemuck = "1.25.2"
anyhow = "1.0.96"
tokio = { version = "1.43.0", features = ["full"] }
rand = "0.10.2"
jito-sdk-rust = "0.3.2"
bincode = { version = "2.0.1", features = ["serde"] }
base64 = "0.23.1"
log = "0.4.26"
serde_json = "1.0.133"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
solana-commitment-config = "3.1.1"
solana-native-token = "3.0.0"
